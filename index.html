<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clip Vault - Video Downloader</title>
    <!-- Prevents Favicon 404 console error -->
    <link rel="icon" href="data:," />
    <!-- Production Tailwind CSS (No console warning) -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-gray-800 rounded-2xl shadow-2xl border border-gray-700 p-6 text-center">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-3xl font-extrabold text-indigo-400">
                Clip Vault
            </h1>
            <p class="text-xs text-gray-400 mt-1">Download YouTube Shorts & Videos easily</p>
        </div>

        <!-- Input Form -->
        <form onsubmit="handleDownload(event)" class="space-y-4">
            <div class="relative flex items-center">
                <span id="badge" class="absolute left-3 text-gray-400">
                    <i class="fa-solid fa-link"></i>
                </span>
                <input type="url"
                       id="videoUrl"
                       oninput="checkPlatform(this.value)"
                       placeholder="Paste YouTube or Shorts URL here..."
                       required
                       class="w-full pl-10 pr-4 py-3 bg-gray-900 border border-gray-700 rounded-xl text-sm text-gray-100 focus:outline-none focus:border-indigo-500 transition-colors placeholder-gray-500" />
            </div>

            <button type="submit"
                    id="dlBtn"
                    class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl text-sm transition-all shadow-lg flex items-center justify-center gap-2">
                <i class="fa-solid fa-download"></i> Download Video
            </button>
        </form>

        <!-- Status Message -->
        <div id="status" class="mt-4 text-xs font-medium text-gray-400 min-h-[20px]"></div>

        <!-- Backup Manual Download Button -->
        <div id="resultContainer" class="mt-4 hidden">
            <a id="downloadLink"
               href="#"
               target="_blank"
               rel="noopener noreferrer"
               download="video.mp4"
               class="inline-flex items-center gap-2 px-5 py-2.5 bg-green-600 hover:bg-green-500 text-white text-xs font-semibold rounded-lg shadow transition-all">
                <i class="fa-solid fa-file-arrow-down"></i> Click Here to Save MP4
            </a>
        </div>
    </div>

    <script>
        function checkPlatform(url) {
            const badge = document.getElementById('badge');
            const status = document.getElementById('status');
            const resultContainer = document.getElementById('resultContainer');
            if (resultContainer) resultContainer.classList.add('hidden');

            const isYt = /youtube\.com|youtu\.be/.test(url);

            if (isYt) {
                if (badge) badge.innerHTML = '<i class="fa-brands fa-youtube text-red-500 text-lg"></i>';
                if (status) status.textContent = "YouTube clip detected";
            } else if (url.trim() === "") {
                if (badge) badge.innerHTML = '<i class="fa-solid fa-link"></i>';
                if (status) status.textContent = "";
            } else {
                if (badge) badge.innerHTML = '<i class="fa-solid fa-circle-exclamation text-amber-500"></i>';
                if (status) status.textContent = "Unrecognized link format";
            }
        }

        async function handleDownload(e) {
            e.preventDefault();

            const videoInput = document.getElementById('videoUrl');
            const status = document.getElementById('status');
            const btn = document.getElementById('dlBtn');
            const resultContainer = document.getElementById('resultContainer');
            const downloadLink = document.getElementById('downloadLink');

            if (!videoInput) return;
            const rawUrl = videoInput.value.trim();
            if (!rawUrl) return;

            // Loading State
            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-not-allowed');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing...`;
            status.textContent = "Extracting direct video stream...";
            resultContainer.classList.add('hidden');

            try {
                // Fetch stream exclusively from backend API (avoids client CORS blocks)
                const response = await fetch(`/api/download?url=${encodeURIComponent(rawUrl)}`);
                const data = await response.json();

                if (response.ok && data.success && data.downloadUrl) {
                    status.textContent = "Download starting...";

                    // Update backup download button
                    downloadLink.href = data.downloadUrl;
                    resultContainer.classList.remove('hidden');

                    // Trigger 1-Click Browser Download
                    const tempLink = document.createElement('a');
                    tempLink.href = data.downloadUrl;
                    tempLink.target = '_blank';
                    tempLink.rel = 'noopener noreferrer';
                    tempLink.setAttribute('download', 'video.mp4');
                    document.body.appendChild(tempLink);
                    tempLink.click();
                    tempLink.remove();

                    status.textContent = "Download initiated!";
                } else {
                    status.textContent = data.error || "Extraction servers are busy. Please try again.";
                }
            } catch (err) {
                status.textContent = "Network error connecting to backend server.";
            }

            // Reset Button State
            btn.disabled = false;
            btn.classList.remove('opacity-70', 'cursor-not-allowed');
            btn.innerHTML = `<i class="fa-solid fa-download"></i> Download Video`;
        }
    </script>
</body>
</html>
