<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clip Vault - Video Downloader</title>
    <link rel="icon" href="data:," />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-gray-800 rounded-2xl shadow-2xl border border-gray-700 p-6 text-center">
        <div class="mb-6">
            <h1 class="text-3xl font-extrabold text-indigo-400">Clip Vault</h1>
            <p class="text-xs text-gray-400 mt-1">Fast YouTube Shorts & Video Downloader</p>
        </div>

        <form onsubmit="handleDownload(event)" class="space-y-4">
            <div class="relative flex items-center">
                <span id="badge" class="absolute left-3 text-gray-400">
                    <i class="fa-solid fa-link"></i>
                </span>
                <input type="url"
                       id="videoUrl"
                       oninput="checkPlatform(this.value)"
                       placeholder="Paste YouTube or Shorts URL here..."
                       required
                       class="w-full pl-10 pr-4 py-3 bg-gray-900 border border-gray-700 rounded-xl text-sm text-gray-100 focus:outline-none focus:border-indigo-500 transition-colors placeholder-gray-500" />
            </div>

            <button type="submit"
                    id="dlBtn"
                    class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl text-sm transition-all shadow-lg flex items-center justify-center gap-2">
                <i class="fa-solid fa-download"></i> Download Video
            </button>
        </form>

        <div id="status" class="mt-4 text-xs font-medium text-gray-400 min-h-[20px]"></div>

        <div id="resultContainer" class="mt-4 hidden space-y-3">
            <div id="videoMeta" class="text-sm font-semibold text-indigo-300"></div>
            <a id="downloadLink"
               href="#"
               target="_blank"
               rel="noopener noreferrer"
               download="video.mp4"
               class="inline-flex items-center gap-2 px-5 py-2.5 bg-green-600 hover:bg-green-500 text-white text-xs font-semibold rounded-lg shadow transition-all">
                <i class="fa-solid fa-file-arrow-down"></i> Click Here to Save Video (MP4)
            </a>
        </div>
    </div>

    <script>
        function checkPlatform(url) {
            const badge = document.getElementById('badge');
            const status = document.getElementById('status');
            const resultContainer = document.getElementById('resultContainer');
            if (resultContainer) resultContainer.classList.add('hidden');

            const isYt = /youtube\.com|youtu\.be/.test(url);

            if (isYt) {
                if (badge) badge.innerHTML = '<i class="fa-brands fa-youtube text-red-500 text-lg"></i>';
                if (status) status.textContent = "YouTube clip detected";
            } else if (url.trim() === "") {
                if (badge) badge.innerHTML = '<i class="fa-solid fa-link"></i>';
                if (status) status.textContent = "";
            } else {
                if (badge) badge.innerHTML = '<i class="fa-solid fa-circle-exclamation text-amber-500"></i>';
                if (status) status.textContent = "Unrecognized link format";
            }
        }

        async function handleDownload(e) {
            e.preventDefault();

            const videoInput = document.getElementById('videoUrl');
            const status = document.getElementById('status');
            const btn = document.getElementById('dlBtn');
            const resultContainer = document.getElementById('resultContainer');
            const downloadLink = document.getElementById('downloadLink');
            const videoMeta = document.getElementById('videoMeta');

            const rawUrl = videoInput.value.trim();
            if (!rawUrl) return;

            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-not-allowed');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing...`;
            status.textContent = "Extracting media stream...";
            resultContainer.classList.add('hidden');

            // Extract YouTube Video ID
            const ytMatch = rawUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/))([\w-]{11})/);
            const videoId = ytMatch ? ytMatch[1] : null;

            if (!videoId) {
                status.textContent = "Invalid YouTube URL.";
                btn.disabled = false;
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
                btn.innerHTML = `<i class="fa-solid fa-download"></i> Download Video`;
                return;
            }

            try {
                // We query reliable public APIs directly
                const res = await fetch(`https://api.cobalt.tools`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: `https://www.youtube.com/watch?v=${videoId}`,
                        videoQuality: '720'
                    })
                });

                const data = await res.json();

                if (data && (data.url || (data.picker && data.picker[0]))) {
                    const downloadUrl = data.url || data.picker[0].url;

                    status.textContent = "Video ready!";
                    downloadLink.href = downloadUrl;
                    videoMeta.textContent = "Click below to save your file:";
                    resultContainer.classList.remove('hidden');

                    // Auto-trigger download tab
                    window.open(downloadUrl, '_blank');
                } else {
                    // Fallback redirect method if API blocks IP
                    status.textContent = "Opening stream viewer...";
                    const fallbackUrl = `https://yewtu.be/watch?v=${videoId}`;
                    window.open(fallbackUrl, '_blank');
                }
            } catch (err) {
                // Browser CORS fallback: Open direct video player
                status.textContent = "Opening video stream directly...";
                window.open(`https://yewtu.be/watch?v=${videoId}`, '_blank');
            }

            btn.disabled = false;
            btn.classList.remove('opacity-70', 'cursor-not-allowed');
            btn.innerHTML = `<i class="fa-solid fa-download"></i> Download Video`;
        }
    </script>
</body>
</html>
